<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="faida-bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Outer Border Gradient -->
    <linearGradient id="faida-border" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Top Wing Gradient -->
    <linearGradient id="faida-top" x1="14" y1="12" x2="50" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="60%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <!-- Lightning Bolt Gradient -->
    <linearGradient id="faida-bolt" x1="16" y1="26" x2="48" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="45%" stop-color="#3b82f6"/>
      <stop offset="85%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- Core Glow -->
    <filter id="faida-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Rounded Squircle Base -->
  <rect width="64" height="64" rx="16" fill="url(#faida-bg)"/>
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="url(#faida-border)" stroke-width="1.5" fill="none"/>

  <!-- Subtle Radial Ambient Light -->
  <circle cx="32" cy="30" r="20" fill="#3b82f6" fill-opacity="0.15" filter="url(#faida-glow)"/>

  <!-- Stylized F + Execution Bolt Emblem -->
  <g filter="url(#faida-glow)">
    <!-- Vertical Spine of F -->
    <rect x="15" y="14" width="7" height="36" rx="3.5" fill="url(#faida-top)"/>

    <!-- Top Bar of F -->
    <path d="M19 14 H46 C48.2 14 49.6 16.2 48.8 18.2 L47.2 22.2 C46.7 23.3 45.6 24 44.4 24 H19 Z" fill="url(#faida-top)"/>

    <!-- Middle Lightning Bolt Arm -->
    <path d="M19 28.5 H39 C40.8 28.5 41.8 30.5 40.8 31.9 L32.5 40 H38.5 C40.2 40 41.1 42 40 43.3 L27 54 C25.8 55 24 53.8 24.6 52.4 L28 44.5 H19 Z" fill="url(#faida-bolt)"/>

    <!-- Golden/Emerald Spark Accent -->
    <circle cx="47.5" cy="18.5" r="2" fill="#38bdf8"/>
    <circle cx="27" cy="53" r="1.5" fill="#10b981"/>
  </g>
</svg>
